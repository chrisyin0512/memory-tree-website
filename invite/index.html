<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Tree Invite</title>
  <script defer src="/assets/analytics.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #2f251c;
      --muted: #756756;
      --paper: #fffaf3;
      --warm: #f4ebdf;
      --accent: #8a5a1f;
      --border: #e3d6c4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--warm);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 420px);
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--paper);
    }

    h1 {
      margin: 0 0 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      line-height: 1.15;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
    }

    a.button {
      display: block;
      width: 100%;
      margin: 18px 0;
      padding: 14px 18px;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }

    .code {
      padding: 14px 16px;
      border-radius: 12px;
      background: #efe2d0;
    }

    .label {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .token {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .08em;
    }
  </style>
</head>
<body>
  <main>
    <h1>Open Memory Tree</h1>
    <p>Your invite is ready. If Memory Tree is installed, this page should open it automatically.</p>
    <a class="button" id="open-link" href="#">Open invite</a>
    <div class="code">
      <div class="label">Invite code</div>
      <div class="token" id="token">----</div>
    </div>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = (params.get("token") || "").trim();
      var tokenEl = document.getElementById("token");
      var linkEl = document.getElementById("open-link");

      if (!token) {
        tokenEl.textContent = "Missing";
        linkEl.removeAttribute("href");
        return;
      }

      var appUrl = "memorytree://invite?token=" + encodeURIComponent(token);
      tokenEl.textContent = token;
      linkEl.setAttribute("href", appUrl);

      setTimeout(function () {
        window.location.href = appUrl;
      }, 700);
    })();
  </script>
</body>
</html>
